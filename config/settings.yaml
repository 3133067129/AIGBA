# AI 玩宝可梦绿宝石386 - 全局配置
rom:
  path: "GBA-lvbaoshi/lvbaoshi365/绿宝石386v2.1个人修复版.gba"
  sav: "GBA-lvbaoshi/lvbaoshi365/绿宝石386v2.1个人修复版.sav"
  # sav 尾部追加的 VBA 式 footer 字节数（加载失败时截除）
  sav_footer_bytes: 16

llm:
  provider: "ollama"            # ollama | claude | mock
  model: "qwen2.5vl:7b"
  base_url: "http://localhost:11434"
  timeout_sec: 90
  num_ctx: 4096              # 必须：默认 128k context 在本机内存拟合失败
  # claude provider 升级路径:
  #   api_key_env: "ANTHROPIC_API_KEY"
  #   model: "claude-sonnet-4-5"

emulator:
  target_fps: 60                # 决策节流目标帧率
  frames_per_decision: 30       # 每步最大跑帧数
  key_hold_frames: 8            # 单次按键按住帧数

controller:
  move_timeout_frames: 600      # 移动超时（撞墙回退）
  talk_press_frames: [6, 6, 6]  # 对话 A 连按节奏

agent:
  short_memory_len: 12          # 短期记忆步数
  llm_interval_min: 10          # 两次 LLM 场景理解之间的最小帧间隔
  checkpoint_interval_sec: 180  # 定期存档间隔（秒）
  max_steps_before_save: 200    # 无事件步数上限（防呆）

persistence:
  checkpoint_dir: "data/checkpoints"
  knowledge_dir: "data/knowledge"
  screenshot_dir: "data/screenshots"
  log_dir: "data/logs"

battle:
  # 捕获目标 HP 阈值（百分比）
  catch_hp_ratio: 0.15
  # 捕获前优先使用的状态
  catch_status: "sleep"
